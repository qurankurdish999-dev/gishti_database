{% extends "base.html" %}
{% block title %}بەڵگەی نوێ{% endblock %}
{% block content %}
<h2 class="page-title"><span class="icon">🧾</span> زیادکردنی بەڵگەی نوێ</h2>

<div class="card" style="max-width:600px">
  <div class="card-body">
    <form method="POST">
      <div class="mb-2">
        <label class="form-label">جۆری بەڵگە *</label>
        <select name="trans_type" id="transType" class="form-select" required onchange="toggleFields()">
          {% for key, label in labels.items() %}
            <option value="{{ key }}" {% if key == default_type %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-2" id="partyField">
        <label class="form-label" id="partyLabel">لایەن</label>
        <select name="party_id" class="form-select">
          <option value="">-- هەڵبژاردن --</option>
          {% for p in parties %}
            <option value="{{ p.id }}">{{ p.name }} ({{ 'کڕیار' if p.party_type == 'customer' else ('دابینکەر' if p.party_type == 'supplier' else 'هەردووکیان') }})</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-2" id="toPartyField" style="display:none">
        <label class="form-label">بۆ لایەنی (گواستنەوە بۆ)</label>
        <select name="to_party_id" class="form-select">
          <option value="">-- هەڵبژاردن --</option>
          {% for p in parties %}
            <option value="{{ p.id }}">{{ p.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-2">
        <label class="form-label">بڕی پارە *</label>
        <input type="number" step="0.01" name="amount" class="form-control" required>
      </div>

      <div class="mb-2">
        <label class="form-label">تێبینی</label>
        <textarea name="note" class="form-control" rows="2"></textarea>
      </div>

      <button type="submit" class="btn btn-primary"><span class="icon">💾</span> هەڵگرتن</button>
      <a href="{{ url_for('transactions') }}" class="btn btn-secondary">پاشگەزبوونەوە</a>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function toggleFields() {
  const type = document.getElementById('transType').value;
  const partyField = document.getElementById('partyField');
  const toPartyField = document.getElementById('toPartyField');
  const partyLabel = document.getElementById('partyLabel');

  if (type === 'transfer') {
    partyField.style.display = '';
    toPartyField.style.display = '';
    partyLabel.textContent = 'لە لایەنی (گواستنەوە لە)';
  } else if (type === 'expense_general' || type === 'expense_purchase') {
    partyField.style.display = 'none';
    toPartyField.style.display = 'none';
  } else {
    partyField.style.display = '';
    toPartyField.style.display = 'none';
    partyLabel.textContent = type === 'payment' ? 'دابینکەر' : (type === 'receipt' ? 'کڕیار' : 'لایەن');
  }
}
toggleFields();
</script>
{% endblock %}
